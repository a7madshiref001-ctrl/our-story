<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حكايتكم جاهزة — Our Story</title>
<link rel="icon" href="../assets/favicon-64.png" type="image/png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,700,401&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/fonts.css?v=10">
<link rel="stylesheet" href="../assets/ui.css?v=10">
<script>document.documentElement.classList.add("js")</script>
<style>
:root{--bg:#F7F2EA;--card:#FFFFFF;--ink:#302622;--soft:#8C7C72;--line:#E2D6C8;--acc:#BD5265;--tint:#EBD6D2;--ok:#4E7A4A;--en:'Zodiak',Georgia,serif;--ar:'Estedad',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.w{max-width:520px;margin:0 auto;padding:34px 16px 50px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.wait{text-align:center;padding:80px 10px;color:var(--soft)}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{text-align:center}
.hero .k{font-family:var(--en);font-weight:700;font-size:44px;line-height:1;color:var(--acc)}
.hero h1{font-size:30px;font-weight:800;line-height:1.35;margin:10px 0 6px}
.hero p{color:var(--soft)}
.link{display:flex;gap:8px;align-items:center;background:#FFFDF8;border:1.5px solid #DDD0C1;border-radius:16px 16px 16px 5px;padding:6px;margin:26px 0 12px;transition:border-color .3s,box-shadow .4s var(--e-out)}
.link:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(189,82,101,.12)}
.link input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;direction:ltr;text-align:left;padding:6px;color:var(--ink);outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{width:100%;padding:0 12px}
.card{border-top:1px solid var(--line);padding:22px 0 6px;margin-top:22px}
.card h2{font-size:19px;font-weight:800;margin-bottom:4px}
.card .p{font-size:14px;color:var(--soft);margin-bottom:12px}
.qrw{display:flex;gap:16px;align-items:center}
#qr{background:#fff;padding:10px;border-radius:14px 14px 14px 4px;border:1px solid var(--line);flex:none;box-shadow:0 20px 30px -24px rgba(48,38,34,.5)}
#qr img,#qr canvas{display:block;width:132px;height:132px}
.ideas{display:grid;gap:10px}
.idea{display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.idea b{display:block}
.idea .n{flex:none;font-family:var(--en);font-style:italic;font-size:24px;line-height:1.2;color:var(--acc);width:26px}
.note{background:var(--tint);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14px;margin-top:12px}
.small{font-size:13px;color:var(--soft);text-align:center;margin-top:18px}
.small a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px 14px 14px 4px;font-size:14px;transition:transform .6s var(--e-spring);z-index:80}
.copied{background:var(--os-rose)!important}
.toast.show{transform:translate(-50%,0)}
canvas.cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div class="w" id="w"><div class="wait"><div class="spin"></div>بنتأكد من الدفع</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../assets/config.js?v=10"></script>
<script src="../assets/api.js?v=10"></script>
<script src="../assets/render.js?v=10"></script>
<script src="../assets/motion.js?v=10"></script>
<script>
(function () {
  var API = OS_API, CFG = OS_CONFIG, R = OS_RENDER, esc = R.esc, w = document.getElementById('w');
  var id = new URLSearchParams(location.search).get('id');
  var ss = API.session.get();
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 2400); }

  if (!ss || !ss.token || (id && ss.id !== id)) {
    w.innerHTML = '<div class="wait">افتح الصفحة دي من نفس الموبايل اللي عملت منه الحكاية.<br><br><a class="btn ink" href="../">الرئيسية</a></div>';
    return;
  }

  var tries = 0;
  (function poll() {
    API.getStatus(ss.id, ss.token).then(function (r) {
      if (r && r.status === 'paid' && r.slug) return ready(r);
      if (++tries < 40) return setTimeout(poll, 2500);
      var sup = CFG.supportWhatsApp ? '<br><br><a class="btn wa" href="https://wa.me/' + encodeURIComponent(CFG.supportWhatsApp) + '" target="_blank" rel="noopener">كلّمنا على واتساب</a>' : '';
      w.innerHTML = '<div class="wait">الدفع لسه ما اتأكدش.<br>لو الفلوس اتخصمت، افتح الصفحة دي تاني بعد دقايق.' + sup + '<br><br><a class="btn paper" href="../start/">رجوع</a></div>';
    }).catch(function () { if (++tries < 40) setTimeout(poll, 2500); });
  })();

  function storyUrl(slug) {
    var base = CFG.siteUrl ? CFG.siteUrl.replace(/\/$/, '') + '/s/' : new URL('../s/', location.href).href;
    return base + '?s=' + encodeURIComponent(slug);
  }

  function ready(r) {
    var d = r.data || {}, url = storyUrl(r.slug), her = d.her || '', him = d.him || '';
    var locked = r.plan === 'full' && d.lock && d.lock.on && d.lock.at && new Date(d.lock.at) > new Date();
    var msg = (her ? her + '، ' : '') + 'عملتلك حاجة. افتحيها لما تبقي لوحدك\n' + url;
    w.innerHTML =
      '<div class="hero"><img data-rv="fade" src="../assets/logo.png" alt="Our Story" style="width:110px;height:auto;margin:0 auto 26px;display:block"><h1 data-split style="--d:.15s">حكايتكم جاهزة يا ' + esc(him) + '</h1><p data-rv style="--d:.45s">ده اللينك بتاع ' + esc(her) + '.</p></div>' +
      '<div class="link" data-rv style="--d:.6s"><input id="url" readonly value="' + esc(url) + '"><button class="btn ink sm na" id="copy">انسخ</button></div>' +
      '<div class="row" data-rv style="--d:.72s"><a class="btn na" href="' + esc(url) + '" target="_blank" rel="noopener">افتحها</a><a class="btn ink na" href="https://wa.me/?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">ابعتهولها واتساب</a></div>' +
      (locked ? '<div class="note">مقفولة لحد <b>' + esc(new Date(d.lock.at).toLocaleString('ar-EG-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' })) + '</b>. ابعتها من دلوقتي عادي، هتلاقي عدّاد لحد الميعاد.</div>' : '') +
      '<div class="card" data-rv><h2>كارت تطبعه</h2><p class="p">مقاسه 9 في 5.5 سم. حطه مع الورد أو الهدية، وهي تصوّر الكود وتفتحها.</p>' +
        '<div class="qrw"><div id="qr"></div><div style="flex:1;display:grid;gap:8px"><button class="btn sm" id="dl">نزّل الكارت</button><button class="btn paper sm na" id="dlqr">الكود لوحده</button></div></div></div>' +
      '<div class="card" data-rv><h2>تديهالها إزاي؟</h2><div class="ideas" style="margin-top:10px" data-stagger=".1">' +
        '<div class="idea" data-rv><span class="n">1</span><div><b>الساعة 12 بالليل</b>ابعتلها اللينك أول ما يومها يبدأ.</div></div>' +
        '<div class="idea" data-rv><span class="n">2</span><div><b>مع الورد</b>اطبع الكارت وحطه في البوكيه.</div></div>' +
        '<div class="idea" data-rv><span class="n">3</span><div><b>وإنتوا مع بعض</b>افتحها على موبايلها وسيبها تكمّلها.</div></div>' +
      '</div></div>' +
      '<p class="small" data-rv="fade">احفظ اللينك. <a href="../start/?edit=1">عدّل</a> · <a href="#" id="newOne">حكاية جديدة</a></p>';

    document.getElementById('newOne').onclick = function (e) {
      e.preventDefault();
      if (!confirm('احفظ اللينك ده الأول. نبدأ حكاية جديدة؟')) return;
      API.session.clear(); location.href = '../start/';
    };
    document.getElementById('copy').onclick = function () {
      var i = document.getElementById('url'); i.select();
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).catch(function () { document.execCommand('copy'); }).then(function () { toast('اتنسخ'); var c = document.getElementById('copy'); c.textContent = 'اتنسخ'; c.classList.add('copied'); setTimeout(function () { c.textContent = 'انسخ'; c.classList.remove('copied'); }, 1800); });
    };
    OSUI.observe(w);
    var qrBox = document.getElementById('qr'), qrOk = !!window.QRCode;
    if (qrOk) new QRCode(qrBox, { text: url, width: 264, height: 264, colorDark: '#2A221E', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    else qrBox.innerHTML = '<div style="width:132px;font-size:12px">الكود ما اتحمّلش</div>';
    function qrCanvas() { return qrBox.querySelector('canvas'); }
    function save(c, name) { var a = document.createElement('a'); a.download = name; a.href = c.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove(); }
    document.getElementById('dlqr').onclick = function () { var c = qrCanvas(); if (c) save(c, 'our-story-qr.png'); };
    document.getElementById('dl').onclick = function () {
      var q = qrCanvas(); if (!q) return toast('الكود ما اتحمّلش');
      /* كارت 90×55 مم بدقة 300dpi، والكود 25 مم */
      var big = document.createElement('div');
      new QRCode(big, { text: url, width: 600, height: 600, colorDark: '#302622', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
      var logo = new Image(); logo.src = '../assets/logo.png';
      var ready = new Promise(function (res) { if (logo.complete) res(); else { logo.onload = res; logo.onerror = res; } });
      Promise.all([ready, document.fonts.load('700 40px "Zodiak"'), document.fonts.load('italic 400 40px "Zodiak"'), document.fonts.load('800 20px "Estedad"'), document.fonts.load('400 20px "Estedad"')]).catch(function () {}).then(function () {
        var qc = big.querySelector('canvas') || q;
        var mm = 300 / 25.4, W = Math.round(90 * mm), H = Math.round(55 * mm);
        var c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d');
        x.fillStyle = '#F7F2EA'; x.fillRect(0, 0, W, H);
        x.strokeStyle = '#BD5265'; x.lineWidth = 2; x.strokeRect(26, 26, W - 52, H - 52);
        var qs = Math.round(25 * mm), qx = 70, qy = Math.round((H - qs) / 2);
        x.fillStyle = '#fff'; x.fillRect(qx - 16, qy - 16, qs + 32, qs + 32);
        x.imageSmoothingEnabled = false; x.drawImage(qc, qx, qy, qs, qs); x.imageSmoothingEnabled = true;
        var R = W - 72;
        x.textAlign = 'right'; x.direction = 'ltr';
        x.fillStyle = '#BD5265'; x.font = 'italic 400 46px "Zodiak"'; x.fillText('for ' + (d.herEn || her), R, 190);
        x.direction = 'rtl'; x.fillStyle = '#302622'; x.font = '800 46px "Estedad"'; x.fillText('فيه حاجة مستنياكي', R, 290);
        x.fillStyle = '#8C7C72'; x.font = '400 28px "Estedad"'; x.fillText('صوّري الكود بكاميرا الموبايل', R, 350);
        x.fillText('من ' + him, R, 400);
        if (logo.naturalWidth) { var lw = 190, lh = lw * logo.naturalHeight / logo.naturalWidth; x.drawImage(logo, R - lw, H - 70 - lh, lw, lh); }
        save(c, 'our-story-card.png');
      });
    };
    if (!sessionStorage.getItem('os:cf:' + r.slug)) { try { sessionStorage.setItem('os:cf:' + r.slug, '1'); } catch (e) {} confetti(); }
  }

  function confetti() {
    var cv = document.createElement('canvas'); cv.className = 'cf'; document.body.appendChild(cv);
    var x = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, ps = [], cols = ['#B4545A', '#F2D9D2', '#A8865A', '#4F7A55', '#fff'];
    for (var i = 0; i < 120; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, r: 4 + Math.random() * 5, c: cols[i % 5], vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, a: Math.random() * 6 });
    var t0 = performance.now();
    (function fr(t) { x.clearRect(0, 0, W, H); ps.forEach(function (p) { p.y += p.vy; p.x += p.vx + Math.sin(p.a += .05); x.fillStyle = p.c; x.fillRect(p.x, p.y, p.r, p.r / 2); }); if (t - t0 < 4200) requestAnimationFrame(fr); else cv.remove(); })(t0);
  }
})();
</script>
</body>
</html>
